<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>消防员灭火 - 硬核液体物理</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: #0a0a0f;
            color: #fff;
            font-family: 'Microsoft YaHei', Arial, sans-serif;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            align-items: center;
            height: 100vh;
        }
        #gameCanvas {
            display: block;
            background: #1a1a2e;
            cursor: crosshair;
        }
        #ui-overlay {
            position: fixed;
            top: 0; left: 0; right: 0;
            padding: 10px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: linear-gradient(to bottom, rgba(0,0,0,0.8), transparent);
            pointer-events: none;
            z-index: 10;
        }
        #ui-overlay > * { pointer-events: auto; }
        .hud-left, .hud-right { display: flex; align-items: center; gap: 15px; }
        .hud-item {
            background: rgba(0,0,0,0.6);
            border: 1px solid rgba(255,255,255,0.2);
            border-radius: 8px;
            padding: 6px 12px;
            font-size: 13px;
        }
        .hud-item .label { color: #aaa; font-size: 11px; }
        .hud-item .value { color: #fff; font-weight: bold; }
        .water-bar { width: 120px; height: 8px; background: #333; border-radius: 4px; overflow: hidden; }
        .water-bar-fill { height: 100%; background: linear-gradient(90deg, #00b4d8, #48cae4); transition: width 0.2s; }
        .health-bar { width: 100px; height: 8px; background: #333; border-radius: 4px; overflow: hidden; }
        .health-bar-fill { height: 100%; background: linear-gradient(90deg, #e63946, #f4a261); transition: width 0.2s; }
        .oxygen-bar { width: 100px; height: 8px; background: #333; border-radius: 4px; overflow: hidden; }
        .oxygen-bar-fill { height: 100%; background: linear-gradient(90deg, #2ecc71, #87e0ad); transition: width 0.2s; }
        #level-intro {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.9);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 100;
            transition: opacity 0.5s;
        }
        #level-intro.hidden { opacity: 0; pointer-events: none; }
        #level-intro h1 { font-size: 48px; margin-bottom: 10px; color: #f4a261; text-shadow: 0 0 20px rgba(244,162,97,0.5); }
        #level-intro h2 { font-size: 28px; margin-bottom: 20px; color: #48cae4; }
        #level-intro p { font-size: 16px; color: #ccc; margin: 5px 0; max-width: 500px; text-align: center; }
        #level-intro .equipment { color: #2ecc71; font-size: 18px; margin: 15px 0; padding: 10px 20px; border: 1px solid #2ecc71; border-radius: 8px; }
        #level-intro .start-btn {
            margin-top: 30px; padding: 15px 40px;
            background: linear-gradient(135deg, #e63946, #f4a261);
            border: none; border-radius: 10px;
            color: #fff; font-size: 20px; cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
        }
        #level-intro .start-btn:hover { transform: scale(1.05); box-shadow: 0 0 30px rgba(230,57,70,0.5); }
        #game-over {
            position: fixed; top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.85);
            display: none; flex-direction: column;
            align-items: center; justify-content: center; z-index: 100;
        }
        #game-over h1 { font-size: 42px; margin-bottom: 20px; }
        #game-over .retry-btn {
            margin-top: 20px; padding: 12px 30px;
            background: #48cae4; border: none; border-radius: 8px;
            color: #fff; font-size: 18px; cursor: pointer;
        }
        #controls-hint {
            position: fixed; bottom: 10px; left: 50%; transform: translateX(-50%);
            background: rgba(0,0,0,0.7); padding: 8px 16px; border-radius: 6px;
            font-size: 12px; color: #aaa; z-index: 10;
        }
    </style>
    <meta name="x-ogp-key" content="ea8e2e0d-3406-45a2-a869-4058b2002275" />
    <script src="https://sdk.play.fun/latest"></script>
</head>
<body>
    <canvas id="gameCanvas"></canvas>
    <div id="ui-overlay">
        <div class="hud-left">
            <div class="hud-item">
                <div class="label">关卡</div>
                <div class="value" id="hud-level">1</div>
            </div>
            <div class="hud-item">
                <div class="label">水量</div>
                <div class="water-bar"><div class="water-bar-fill" id="hud-water" style="width:100%"></div></div>
            </div>
            <div class="hud-item">
                <div class="label">生命</div>
                <div class="health-bar"><div class="health-bar-fill" id="hud-health" style="width:100%"></div></div>
            </div>
            <div class="hud-item">
                <div class="label">氧气</div>
                <div class="oxygen-bar"><div class="oxygen-bar-fill" id="hud-oxygen" style="width:100%"></div></div>
            </div>
            <div class="hud-item">
                <div class="label">体温</div>
                <div class="value" id="hud-temp">37.0°C</div>
            </div>
        </div>
        <div class="hud-right">
            <div class="hud-item">
                <div class="label">火势</div>
                <div class="value" id="hud-fire">100%</div>
            </div>
            <div class="hud-item">
                <div class="label">装备</div>
                <div class="value" id="hud-equip">基础水管</div>
            </div>
            <div class="hud-item">
                <div class="label">得分</div>
                <div class="value" id="hud-score">0</div>
            </div>
            <div class="hud-item" id="hud-rescue-item" style="display:none">
                <div class="label">救援</div>
                <div class="value" id="hud-rescue">0/0</div>
            </div>
        </div>
    </div>
    <div id="level-intro">
        <h1>🔥 消防员灭火 🔥</h1>
        <h2 id="intro-subtitle">硬核液体物理模拟</h2>
        <p id="intro-desc"></p>
        <div class="equipment" id="intro-equip"></div>
        <p id="intro-tip"></p>
        <button class="start-btn" id="start-btn">开始灭火</button>
    </div>
    <div id="game-over">
        <h1 id="gameover-text">关卡完成!</h1>
        <p id="gameover-score"></p>
        <button class="retry-btn" id="retry-btn">继续</button>
    </div>
    <div id="controls-hint">
        A/D 移动 | W 跳跃/贴墙攀登 | 鼠标瞄准 | 左键喷射 | 右键斧头 | E 互动 | R / 1-5 切换武器 | Space 暂停
    </div>
    <script src="firefighter-game.js"></script>
    <script src="playfun-ff.js"></script>
</body>
</html>
